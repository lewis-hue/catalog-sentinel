# Artist Catalog Sentinel — local integration stack using real services only.
#
#   docker compose up --build
#
# Then open:
#   http://localhost:3000/connect   Connect & scan (Secure Distributor Link) wizard
#   http://localhost:3000           dashboard
#
# Attended login always runs in Steel. PostgreSQL and Redis are mandatory; this file
# contains no synthetic catalogue, fake login, or process-local persistence fallback.
# For the externally managed production reference, see docker-compose.production.yml.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: sentinel
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sentinel']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Self-hosted Keycloak (OIDC) — authentication + RBAC + per-tenant identity. Its own
  # Postgres (keycloak-db). The imported realm contains roles, clients, identity-provider
  # mappers, and a credentialless worker service account, but no interactive demo user.
  # Auth is opt-in locally; provision human users through Google or the admin console.
  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}
      POSTGRES_DB: keycloak
    volumes: [keycloakdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U keycloak']
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}
      KC_HTTP_ENABLED: 'true'
      KC_HEALTH_ENABLED: 'true'
      # FIXED public issuer. Without this, a token minted over the internal backchannel
      # (keycloak:8080) would carry iss=http://keycloak:8080/... while the browser + API expect
      # http://localhost:8080/... — the classic issuer mismatch that rejects every token.
      # KC_HOSTNAME pins the frontend/issuer URL; BACKCHANNEL_DYNAMIC still lets the API and the
      # web BFF reach token/JWKS endpoints over the internal service name.
      # PRODUCTION: set KC_HOSTNAME=https://auth.yourdomain.com.
      KC_HOSTNAME: ${KC_HOSTNAME:-http://localhost:8080}
      KC_HOSTNAME_STRICT: 'false'
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      # Realm-import substitution (kept out of the git-tracked realm JSON):
      #  - Google IdP credentials
      #  - confidential client secrets (web BFF + worker service account)
      #  - redirect/logout allow-lists + web origin
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      KEYCLOAK_WEB_CLIENT_SECRET: ${KEYCLOAK_WEB_CLIENT_SECRET:?Set KEYCLOAK_WEB_CLIENT_SECRET}
      KEYCLOAK_WORKER_CLIENT_SECRET: ${KEYCLOAK_WORKER_CLIENT_SECRET:?Set KEYCLOAK_WORKER_CLIENT_SECRET}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      WEB_REDIRECT_URIS: ${WEB_REDIRECT_URIS:-http://localhost:3000/*}
      WEB_POST_LOGOUT_REDIRECT_URIS: ${WEB_POST_LOGOUT_REDIRECT_URIS:-http://localhost:3000/*}
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
      # Custom login theme (clean tech-SaaS look matching apps/web). Mounted as its own
      # theme dir alongside the built-ins; realm "sentinel" selects it via loginTheme.
      - ./docker/keycloak/themes/sentinel:/opt/keycloak/themes/sentinel:ro
    ports:
      - '127.0.0.1:8080:8080' # loopback-only: the local browser can reach OIDC without LAN exposure
    depends_on: [keycloak-db]

    # Not published to the host — the app reaches it over the compose network.

  # One-shot realm reconciler. The realm JSON declares the right settings, but Keycloak's
  # --import-realm SKIPS a realm that already exists in keycloak-db, so on every restart after the
  # first the JSON has no effect. Two settings must hold or the app breaks, so we re-apply them here
  # (idempotently) on every `up`:
  #   1. default-roles-sentinel must grant `user` — otherwise fresh logins mint tokens with no
  #      Sentinel role, the API rejects every bearer token, and the web app flickers in a redirect loop.
  #   2. editUsernameAllowed must be true — otherwise the profile page's "edit username" is rejected
  #      by Keycloak with error-user-attribute-read-only.
  # This replaces the manual kcadm step that previously had to be run by hand after each restart.
  keycloak-init:
    image: quay.io/keycloak/keycloak:26.0
    entrypoint: ['/bin/bash', '-c']
    command:
      - |
        set -eu
        kc(){ /opt/keycloak/bin/kcadm.sh "$$@"; }
        echo "keycloak-init: waiting for the admin API..."
        until kc config credentials --server http://keycloak:8080 --realm master \
              --user "$$KC_BOOTSTRAP_ADMIN_USERNAME" --password "$$KC_BOOTSTRAP_ADMIN_PASSWORD" >/dev/null 2>&1; do
          sleep 3
        done
        echo "keycloak-init: waiting for the sentinel realm..."
        until kc get roles/user -r sentinel > /tmp/user-role.json 2>/dev/null; do sleep 3; done
        kc update realms/sentinel -s editUsernameAllowed=true >/dev/null 2>&1 \
          && echo "keycloak-init: editUsernameAllowed=true" || echo "keycloak-init: could not set editUsernameAllowed"
        printf '[%s]' "$$(cat /tmp/user-role.json)" > /tmp/composite.json
        if kc create roles/default-roles-sentinel/composites -r sentinel -f /tmp/composite.json >/dev/null 2>&1; then
          echo "keycloak-init: granted 'user' to default-roles-sentinel."
        else
          echo "keycloak-init: 'user' already granted to default-roles-sentinel (ok)."
        fi
        echo "keycloak-init: done."
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
    depends_on: [keycloak]
    restart: 'no'

  migrate:
    image: sentinel-app
    command: ['npm', 'run', '--workspace', '@sentinel/db', 'db:migrate:deploy']
    environment:
      DATABASE_URL: postgresql://sentinel:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/sentinel
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  # Steel (the sole attended browser provider) is external by default. To use an
  # operator-managed self-hosted Steel deployment, add the overlay:
  #   docker compose -f docker-compose.yml -f docker-compose.steel.yml up -d
  # (see docs/steel-local-development.md · steel-remote-linux-dev.md · steel-production.md)

  # API (Fastify) serving the Secure Distributor Link + deep-scan flow.
  scanner:
    build: { context: ., dockerfile: Dockerfile.production }
    image: sentinel-app
    command: ['npm', 'run', 'api']
    environment:
      PORT: '4000'
      LOG_LEVEL: info
      NODE_ENV: development
      FEATURE_BROWSER_ASSIST_ENABLED: 'true'
      # TESTING-ONLY: /api/dev/rescan trigger (re-run scans on the retained warm session). Never prod.
      # Hardened: refuses to boot in prod, loopback-only, requires DEV_RESCAN_SECRET.
      ENABLE_DEV_RESCAN: ${ENABLE_DEV_RESCAN:-}
      DEV_RESCAN_SECRET: ${DEV_RESCAN_SECRET:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://sentinel:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/sentinel
      BROWSER_LINK_PROVIDER: steel
      # Attended real distributor login uses Steel (the browser the user logs into directly).
      #   STEEL_CONNECTOR_MODE = cloud | external | self_hosted
      #     cloud       → Steel's hosted service (steel.dev) via STEEL_API_KEY.
      #                   Set STEEL_CONNECTOR_MODE=cloud + STEEL_API_KEY in your .env.
      #     external     → tunnelled remote Linux Steel  (STEEL_API_URL=http://host.docker.internal:3900)
      #     self_hosted  → private Steel service on Linux (STEEL_API_URL=http://steel:3000)
      #   STEEL_REQUIRED = true  → readiness fails if Steel is not READY
      STEEL_CONNECTOR_MODE: ${STEEL_CONNECTOR_MODE:-cloud}
      STEEL_API_KEY: ${STEEL_API_KEY:-}
      STEEL_API_URL: ${STEEL_API_URL:-}
      STEEL_CDP_INTERNAL: ${STEEL_CDP_INTERNAL:-}
      STEEL_REQUIRED: 'true'
      STEEL_SESSION_TIMEOUT_MS: ${STEEL_SESSION_TIMEOUT_MS:-}
      # TESTING keep-alive: reuse the logged-in Steel session for repeated scans (no re-login).
      DISTRIBUTOR_SESSION_REUSE: ${DISTRIBUTOR_SESSION_REUSE:-}
      # Catalogue reads always use the six-stage network-first pipeline with durable checkpoints.
      # Catalogue-read tuning (DistroKid dashboard is a heavy SPA). Tune via .env + recreate,
      # no rebuild needed. Low concurrency + generous per-page timeout avoids goto timeouts.
      CATALOG_READ_CONCURRENCY: ${CATALOG_READ_CONCURRENCY:-2}
      CATALOG_READ_GOTO_TIMEOUT_MS: ${CATALOG_READ_GOTO_TIMEOUT_MS:-30000}
      # 'commit' + a data-render wait handles DistroKid's SPA where domcontentloaded hangs.
      CATALOG_READ_WAIT_UNTIL: ${CATALOG_READ_WAIT_UNTIL:-commit}
      CATALOG_READ_CONTENT_TIMEOUT_MS: ${CATALOG_READ_CONTENT_TIMEOUT_MS:-30000}
      CATALOG_READ_MAX_DURATION_MS: ${CATALOG_READ_MAX_DURATION_MS:-600000}
      # Attended live scanning (the /api/connect flow) is legal-review gated: it refuses to start
      # a Steel session until the operator attests authorization. Default OFF → connect returns
      # 502 InsecureConfigurationError until both are true.
      ENABLE_DISTROKID_LIVE_SCANNER: ${ENABLE_DISTROKID_LIVE_SCANNER:-false}
      LEGAL_REVIEW_DISTROKID_SCANNER_APPROVED: ${LEGAL_REVIEW_DISTROKID_SCANNER_APPROVED:-false}
      # Direct authenticated JSON reads are a GATED optimization: BOTH flags must be true, and
      # legal review must actually have happened. Default = passive network capture only.
      ENABLE_DISTROKID_DIRECT_JSON_READER: ${ENABLE_DISTROKID_DIRECT_JSON_READER:-false}
      LEGAL_REVIEW_DISTROKID_DIRECT_JSON_APPROVED: ${LEGAL_REVIEW_DISTROKID_DIRECT_JSON_APPROVED:-false}
      DISTROKID_REQUEST_MIN_DELAY_MS: ${DISTROKID_REQUEST_MIN_DELAY_MS:-750}
      DISTROKID_RELEASE_CHUNK_SIZE: ${DISTROKID_RELEASE_CHUNK_SIZE:-}
      # Raw network debug artifacts: OFF by default; TTL'd + sample-capped + redacted when on.
      ENABLE_DISTRIBUTOR_NETWORK_DEBUG: ${ENABLE_DISTRIBUTOR_NETWORK_DEBUG:-false}
      DISTRIBUTOR_NETWORK_DEBUG_TTL_MINUTES: ${DISTRIBUTOR_NETWORK_DEBUG_TTL_MINUTES:-30}
      DISTRIBUTOR_NETWORK_DEBUG_SAMPLE_LIMIT: ${DISTRIBUTOR_NETWORK_DEBUG_SAMPLE_LIMIT:-5}
      # Steel is the only attended-browser path.
      ENABLE_BROWSERLESS_PROVIDER: 'false'
      # Store-scan APIs: Deezer + Apple need no key; the rest activate when these are
      # set (passed through from your shell/.env). No rebuild needed to add them.
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      # YouTube Data API is OFF by default (its 10k/day quota can't cover a real catalogue). YouTube
      # Music web-verifies via the search provider instead. Set true only with a high-quota key.
      YOUTUBE_USE_API: ${YOUTUBE_USE_API:-}
      AUDIOMACK_CONSUMER_KEY: ${AUDIOMACK_CONSUMER_KEY:-}
      AUDIOMACK_CONSUMER_SECRET: ${AUDIOMACK_CONSUMER_SECRET:-}
      AUDIOMACK_PROFILE_URL: ${AUDIOMACK_PROFILE_URL:-}
      SOUNDCLOUD_CLIENT_ID: ${SOUNDCLOUD_CLIENT_ID:-}
      SOUNDCLOUD_CLIENT_SECRET: ${SOUNDCLOUD_CLIENT_SECRET:-}
      SOUNDCLOUD_PROFILE_URL: ${SOUNDCLOUD_PROFILE_URL:-}
      TIDAL_CLIENT_ID: ${TIDAL_CLIENT_ID:-}
      TIDAL_CLIENT_SECRET: ${TIDAL_CLIENT_SECRET:-}
      TIDAL_PROFILE_URL: ${TIDAL_PROFILE_URL:-}
      # Web verification for no-API stores via Serper (hosted Google SERP API). Set SERPER_API_KEY to
      # enable it; missing platform API keys → those platforms auto-fall-through to web verification.
      # Best-effort EVIDENCE only, never a source of truth. SEARCH_PROVIDER is normally left empty
      # (auto = Serper when the key is set); pin SEARCH_PROVIDER=serper to force it.
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-}
      # Serper.dev — sign up at serper.dev (2,500 free queries), put the key in .env. The reliable
      # web-verification path for large/obscure catalogues.
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      SERPER_ENDPOINT: ${SERPER_ENDPOINT:-}
      SERPER_TIMEOUT_MS: ${SERPER_TIMEOUT_MS:-8000}
      SERPER_MAX_RPS: ${SERPER_MAX_RPS:-10}
      SERPER_NUM: ${SERPER_NUM:-30}
      SERPER_CACHE_TTL_SECONDS: ${SERPER_CACHE_TTL_SECONDS:-3600}
      SERPER_CIRCUIT_BREAKER_FAILURE_THRESHOLD: ${SERPER_CIRCUIT_BREAKER_FAILURE_THRESHOLD:-6}
      SERPER_CIRCUIT_BREAKER_RESET_SECONDS: ${SERPER_CIRCUIT_BREAKER_RESET_SECONDS:-30}
      ENABLE_SEARCH_WEB_VERIFY: ${ENABLE_SEARCH_WEB_VERIFY:-true}
      ENABLE_WEB_SEARCH_STORES: ${ENABLE_WEB_SEARCH_STORES:-false}
      # Web search is rate-limited, so the live web scan is bounded (full scan is the CLI).
      CATALOG_SCAN_WEB_LIMIT: ${CATALOG_SCAN_WEB_LIMIT:-5}
      # Background multi-platform deep scan: the API enqueues to Redis (BullMQ); the
      # worker container consumes it. Redis coordinates queues and hot state in this local stack;
      # PostgreSQL remains the migration-owned durable source of truth and recovery authority.
      REDIS_URL: redis://redis:6379
      DEEP_SCAN_DISPATCH: bullmq
      # Supports very large catalogues (labels with many artists → thousands of tracks).
      DEEP_SCAN_MAX_TRACKS_PER_SCAN: ${DEEP_SCAN_MAX_TRACKS_PER_SCAN:-20000}
      DEEP_SCAN_TRACK_CONCURRENCY: ${DEEP_SCAN_TRACK_CONCURRENCY:-8}
      DEEP_SCAN_TRACK_CHUNK_SIZE: ${DEEP_SCAN_TRACK_CHUNK_SIZE:-25}
      DEEP_SCAN_CHECKPOINT_INTERVAL: ${DEEP_SCAN_CHECKPOINT_INTERVAL:-25}
      # Authentication (Keycloak/OIDC). The API verifies bearer tokens: RS256 signature + issuer
      # + audience. KEYCLOAK_BASE_URL is INTERNAL (JWKS fetch over the compose network), but the
      # token's `iss` is the PUBLIC issuer the browser used — so KEYCLOAK_ISSUER must be set
      # explicitly or every token is rejected on an issuer mismatch.
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL:-http://keycloak:8080}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8080/realms/sentinel}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-sentinel}
      KEYCLOAK_API_CLIENT_ID: ${KEYCLOAK_API_CLIENT_ID:-sentinel-api}
      # Bootstrap admin, used ONLY to delete a user's Keycloak login on full account deletion.
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      ENABLE_KEYCLOAK_AUTH: 'true'
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?Set ENCRYPTION_MASTER_KEY}
      GOVERNANCE_HMAC_LOCAL_KEY: ${GOVERNANCE_HMAC_LOCAL_KEY:?Set GOVERNANCE_HMAC_LOCAL_KEY}
    # Wait for HEALTHY, not merely started: Postgres rejects connections with FATAL 57P03
    # ("the database system is starting up") during boot, which would crash this service on a
    # cold `docker compose up`.
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    # The API is reachable only through the web BFF. No local browser or VNC port is
    # published; attended real-browser use always goes through a Steel session.

  # Background deep-scan worker(s) — the Celery-equivalent (BullMQ on Redis). Consumes the
  # multi-platform deep-scan queue and writes results to the SHARED Redis store. Scale with
  # `docker compose up --scale worker=3` (keep DEEP_SCAN_MAX_CONCURRENCY=1 per worker so the
  # Serper query budget isn't overwhelmed by parallel web-heavy scans).
  worker:
    image: sentinel-app
    command: ['npm', 'run', 'worker']
    environment:
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      DEEP_SCAN_DISPATCH: bullmq
      # Supports very large catalogues (labels with many artists → thousands of tracks).
      DEEP_SCAN_MAX_TRACKS_PER_SCAN: ${DEEP_SCAN_MAX_TRACKS_PER_SCAN:-20000}
      DEEP_SCAN_TRACK_CONCURRENCY: ${DEEP_SCAN_TRACK_CONCURRENCY:-8}
      DEEP_SCAN_TRACK_CHUNK_SIZE: ${DEEP_SCAN_TRACK_CHUNK_SIZE:-25}
      DEEP_SCAN_CHECKPOINT_INTERVAL: ${DEEP_SCAN_CHECKPOINT_INTERVAL:-25}
      DEEP_SCAN_MAX_CONCURRENCY: ${DEEP_SCAN_MAX_CONCURRENCY:-1}
      # Decouple scraping from verification: when unset/false the DistroKid scrape does NOT
      # auto-fire the store-presence check — a user triggers it on demand (POST /store-check).
      # Set true to restore the legacy "scrape then immediately verify" chain.
      SCAN_STORE_PRESENCE_AUTO: ${SCAN_STORE_PRESENCE_AUTO:-}
      # Lyric-availability verification (Missing Lyrics module) via LRCLIB — KEYLESS. Blank uses the
      # public host (lrclib.net); point at a self-hosted mirror if desired. No key ever required.
      LYRICS_VERIFY_BASE_URL: ${LYRICS_VERIFY_BASE_URL:-}
      DATABASE_URL: postgresql://sentinel:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/sentinel
      BROWSER_LINK_PROVIDER: steel
      # Steel (same key as the API) so the durable extraction pipeline can re-attach to the
      # user's logged-in cloud browser and read the whole catalogue off the API request path.
      STEEL_CONNECTOR_MODE: ${STEEL_CONNECTOR_MODE:-cloud}
      STEEL_API_KEY: ${STEEL_API_KEY:-}
      STEEL_SESSION_TIMEOUT_MS: ${STEEL_SESSION_TIMEOUT_MS:-}
      # TESTING keep-alive: reuse the logged-in Steel session for repeated scans (no re-login).
      DISTRIBUTOR_SESSION_REUSE: ${DISTRIBUTOR_SESSION_REUSE:-}
      # Index pagination is independent from release-detail extraction. Keep enough bounded
      # rounds for 1,000+ single-release catalogues that load incrementally.
      CATALOG_READ_MAX_RELEASES: ${CATALOG_READ_MAX_RELEASES:-5000}
      CATALOG_INDEX_MAX_SCROLL_ROUNDS: ${CATALOG_INDEX_MAX_SCROLL_ROUNDS:-500}
      # Per-release extraction tuning. DistroKid album pages expose NO JSON endpoint, so the
      # network-first wait is pure overhead before the DOM reader runs — keep it short. And run
      # several release tabs on the one session so a large catalogue finishes inside the Steel
      # session window (bounded concurrency keeps the request rate on the user's own account modest).
      CATALOG_READ_CONTENT_TIMEOUT_MS: ${CATALOG_READ_CONTENT_TIMEOUT_MS:-30000}
      CATALOG_READ_GOTO_TIMEOUT_MS: ${CATALOG_READ_GOTO_TIMEOUT_MS:-30000}
      DISTROKID_RELEASE_CONCURRENCY: ${DISTROKID_RELEASE_CONCURRENCY:-4}
      # Release-chunk size (page pool recycles at each chunk boundary) + per-release pacing delay.
      # Env-tunable so a deploy behind higher CDP latency can use smaller chunks + slower pacing to
      # stay under DistroKid's long-session throttle. Blank -> code defaults (20 / 750ms).
      DISTROKID_RELEASE_CHUNK_SIZE: ${DISTROKID_RELEASE_CHUNK_SIZE:-}
      DISTROKID_REQUEST_MIN_DELAY_MS: ${DISTROKID_REQUEST_MIN_DELAY_MS:-}
      # Dedicated sequential lyric pass (reads DistroKid's lazy-rendered plain/synced lyric state per
      # album, after the fast metadata scrape). Best-effort + deadline-aware. Unset to disable.
      DISTROKID_LYRIC_PASS: ${DISTROKID_LYRIC_PASS:-}
      # Same store-scan credentials as the API so the deep scan can hit every platform.
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      # YouTube Data API is OFF by default (its 10k/day quota can't cover a real catalogue). YouTube
      # Music web-verifies via the search provider instead. Set true only with a high-quota key.
      YOUTUBE_USE_API: ${YOUTUBE_USE_API:-}
      AUDIOMACK_CONSUMER_KEY: ${AUDIOMACK_CONSUMER_KEY:-}
      AUDIOMACK_CONSUMER_SECRET: ${AUDIOMACK_CONSUMER_SECRET:-}
      AUDIOMACK_PROFILE_URL: ${AUDIOMACK_PROFILE_URL:-}
      SOUNDCLOUD_CLIENT_ID: ${SOUNDCLOUD_CLIENT_ID:-}
      SOUNDCLOUD_CLIENT_SECRET: ${SOUNDCLOUD_CLIENT_SECRET:-}
      SOUNDCLOUD_PROFILE_URL: ${SOUNDCLOUD_PROFILE_URL:-}
      TIDAL_CLIENT_ID: ${TIDAL_CLIENT_ID:-}
      TIDAL_CLIENT_SECRET: ${TIDAL_CLIENT_SECRET:-}
      TIDAL_PROFILE_URL: ${TIDAL_PROFILE_URL:-}
      ENABLE_WEB_SEARCH_STORES: ${ENABLE_WEB_SEARCH_STORES:-false}
      # Web-verification backend for the deep scan (same defaults as the API): Serper (hosted SERP
      # API) when SERPER_API_KEY is set, else official APIs only. SEARCH_PROVIDER normally left empty.
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      SERPER_ENDPOINT: ${SERPER_ENDPOINT:-}
      SERPER_TIMEOUT_MS: ${SERPER_TIMEOUT_MS:-8000}
      SERPER_MAX_RPS: ${SERPER_MAX_RPS:-10}
      SERPER_NUM: ${SERPER_NUM:-30}
      SERPER_CACHE_TTL_SECONDS: ${SERPER_CACHE_TTL_SECONDS:-3600}
      SERPER_CIRCUIT_BREAKER_FAILURE_THRESHOLD: ${SERPER_CIRCUIT_BREAKER_FAILURE_THRESHOLD:-6}
      SERPER_CIRCUIT_BREAKER_RESET_SECONDS: ${SERPER_CIRCUIT_BREAKER_RESET_SECONDS:-30}
      ENABLE_SEARCH_WEB_VERIFY: ${ENABLE_SEARCH_WEB_VERIFY:-true}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?Set ENCRYPTION_MASTER_KEY}
      # DIAGNOSTIC album-page capture — off unless DISTROKID_ALBUM_CAPTURE_DIR is set (e.g. to
      # /capture). When set, one real album page's HTML/scripts/response-manifest is written to the
      # mounted ./.capture dir so the DOM reader can be built/verified against DistroKid's markup.
      DISTROKID_ALBUM_CAPTURE_DIR: ${DISTROKID_ALBUM_CAPTURE_DIR:-}
      # Capture a SPECIFIC release (by album UUID) instead of the first, for targeted inspection.
      DISTROKID_ALBUM_CAPTURE_UUID: ${DISTROKID_ALBUM_CAPTURE_UUID:-}
    volumes:
      # Host ./captures is already gitignored (real account data — never committed).
      - ./captures:/capture
    # Wait for HEALTHY, not merely started: Postgres rejects connections with FATAL 57P03
    # ("the database system is starting up") during boot, which would crash this service on a
    # cold `docker compose up`.
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  web:
    image: sentinel-app
    command: ['npm', 'run', 'start', '--workspace', 'apps/web']
    environment:
      # `next start` only serves the app's routes with NODE_ENV=production — so keep it here.
      NODE_ENV: production
      # …but APP_ENV is the authoritative security-transport signal (see lib/auth/config.ts). For
      # LOCAL testing it is "development", which permits plaintext http on the compose network
      # (the web reaches Keycloak at the internal service name keycloak:8080, which can't be
      # HTTPS). FOR A REAL DEPLOYMENT: set APP_ENV=production and use https:// URLs everywhere.
      APP_ENV: ${APP_ENV:-development}
      # The BFF (server-side) attaches the bearer token and proxies to the API. Browser API calls
      # go through /bff/* → here → scanner:4000; the browser never holds a token.
      API_PROXY_TARGET: http://scanner:4000
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      ENABLE_KEYCLOAK_AUTH: 'true'
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-sentinel}
      # Internal (server→server token exchange + JWKS) vs public (browser authorize/logout).
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL:-http://keycloak:8080}
      KEYCLOAK_PUBLIC_BASE_URL: ${KEYCLOAK_PUBLIC_BASE_URL:-http://localhost:8080}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8080/realms/sentinel}
      KEYCLOAK_WEB_CLIENT_ID: ${KEYCLOAK_WEB_CLIENT_ID:-sentinel-web}
      KEYCLOAK_WEB_CLIENT_SECRET: ${KEYCLOAK_WEB_CLIENT_SECRET:?Set KEYCLOAK_WEB_CLIENT_SECRET}
      KEYCLOAK_API_CLIENT_ID: ${KEYCLOAK_API_CLIENT_ID:-sentinel-api}
      # Exact Steel Cloud viewer origins required by frame-src and clipboard permissions.
      # Override only when the selected Steel deployment returns a different reviewed origin.
      STEEL_VIEWER_ORIGINS: ${STEEL_VIEWER_ORIGINS:-https://api.steel.dev https://app.steel.dev}
    ports:
      - '127.0.0.1:3000:3000'

volumes:
  pgdata:
  redisdata:
  keycloakdata:
