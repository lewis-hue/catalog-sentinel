# Catalog Sentinel login theme, clean tech-SaaS look matching apps/web.
# Extends the stock keycloak login theme for message bundles + child templates
# (OTP, update-password, error, etc.), but ships its own template.ftl shell,
# login.ftl form, and a single stylesheet so no PatternFly CSS is loaded.
parent=keycloak
import=common/keycloak

# Only our stylesheet. template.ftl also hardcodes the <link> + web fonts, this
# keeps `properties.styles` honest for any parent template that iterates it.
styles=css/sentinel.css

kcHtmlClass=kc-html
kcBodyClass=kc-body
