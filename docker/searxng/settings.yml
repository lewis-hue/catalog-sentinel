# SearXNG settings for Artist Catalog Sentinel — INTERNAL metasearch layer.
#
# This service is NOT exposed publicly (no host port; private compose network only).
# It provides best-effort web EVIDENCE for platforms with no official API — never a
# source of truth. Our SearxngSearchProvider applies its own rate limit + circuit
# breaker + cache; SearXNG itself throttles upstream engines normally.
#
# COMPLIANCE: no Tor/Privoxy, no proxy rotation, no anti-bot/CAPTCHA evasion. The
# `limiter` below is SearXNG's own bot-protection for PUBLIC exposure; we disable it
# only because this instance is private and accessed programmatically by our backend
# over the internal network — it does not bypass any upstream engine's protections.
use_default_settings: true

server:
  # Local-dev secret only. In production, mount a settings.yml with a real secret
  # (or set it via your orchestrator's secret manager) — see docs/searxng-provider.md.
  secret_key: "sentinel-dev-searxng-secret-change-in-prod"
  limiter: false
  image_proxy: false

search:
  # Enable JSON so our backend can consume structured results.
  formats:
    - html
    - json
  safe_search: 0
  autocomplete: ""

# Keep a small, reliable general-web engine set. (Inherits defaults via
# use_default_settings; trim here later if specific engines prove unreliable.)
