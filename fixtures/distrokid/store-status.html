<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Store status — DistroKid (fixture)</title>
  </head>
  <!-- Standalone store-status page. The scanner reads store selection/delivery
       from the release-detail page's Stores section; this documents the alternate
       per-release store page shape. -->
  <body data-page="store-status" data-authenticated="true">
    <main>
      <h1 data-field="release-title">Lagos Nights</h1>
      <ul data-field="stores">
        <li data-store="Audiomack" data-status="DELIVERED">Audiomack — Delivered</li>
        <li data-store="Spotify" data-status="DELIVERED">Spotify — Delivered</li>
      </ul>
    </main>
  </body>
</html>
